name: DRAW scheduler (DEV)

# Scheduler temporal para DEV mientras el plan de Vercel (Hobby) no permite
# cron con frecuencia suficiente (solo 1x/día). Este workflow es el único
# reemplazo — no coexiste con ningún cron de Vercel para este propósito
# (vercel.json ya no declara crons).
#
# El endpoint (/api/cron/draw-scheduler) es provider-neutral: no le importa
# quién lo llama, solo exige el header Authorization Bearer correcto. El día
# que se reemplace este workflow por Vercel Pro u otro scheduler, no hay que
# tocar drawWinner() ni el endpoint, solo retirar este archivo.
#
# NOTA: los workflows con trigger `schedule` solo se ejecutan realmente
# cuando están en la rama default del repo. Mientras este archivo viva en
# `develop` (no default), GitHub no lo dispara por cron — queda inerte hasta
# que se promueva a `main`, lo cual es intencional para este sprint.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-draw-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Call draw scheduler endpoint
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://rifex-frontend-main.vercel.app/api/cron/draw-scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
